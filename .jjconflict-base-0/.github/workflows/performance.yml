name: Performance lab

on:
  workflow_dispatch:
  schedule:
    - cron: '0 4 * * 1'

permissions:
  contents: read

jobs:
  measure:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      CI: 'true'
      WRANGLER_SEND_METRICS: 'false'
      XDG_STATE_HOME: ${{ github.workspace }}/.performance-state
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: cachix/install-nix-action@v31
      - run: nix develop -c pnpm install --frozen-lockfile
      - run: nix develop -c pnpm run bench:check
      - run: nix develop -c pnpm exec vitest run --project kernel test/events/validation-budgets.test.ts
      - run: nix develop -c pnpm run bench:scale
      - run: nix develop -c pnpm run bench:capacity
      - run: nix develop -c pnpm run bench:capacity:requests
      - run: nix develop -c sh -c 'pnpm run perf:capacity > .performance-state/dghk-familienfreizeit/performance/capacity-report.txt'
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: performance-${{ github.sha }}
          path: .performance-state/dghk-familienfreizeit/performance/
          retention-days: 90
          if-no-files-found: error
