<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Stepper · responsiv (Fensterbreite)</title>
<style>
body{margin:0;background:hsl(33 100% 92%)}
a{color:#000}a:hover{color:#000}
.sp *{box-sizing:border-box}
.sp button{font:inherit;cursor:pointer}
.sp button:disabled{cursor:not-allowed}
.sp a:focus-visible,.sp button:focus-visible{outline:2px solid #000;outline-offset:2px}
.press{box-shadow:4px 4px 0 0 #000;transition:transform .1s,box-shadow .1s}
.press:hover{transform:translate(2px,2px);box-shadow:2px 2px 0 0 #000}
.ghost:hover{background:rgba(0,0,0,.06)!important}
.stp-curlab > span{overflow:hidden;text-overflow:ellipsis}
@container page (width < 48rem){
  .stats{grid-template-columns:repeat(2,minmax(0,1fr))!important}
}
@container page (width < 40rem){
  .pg-main{padding:24px 16px 40px!important;gap:24px!important}
  .stp-crow{flex-wrap:nowrap!important;padding-left:16px!important}
  .stp-col{flex:1 1 0!important}
  .stp-cline{width:12px!important;margin:0 4px!important}
  .stp-curlab{display:flex!important;flex-direction:column;line-height:1.25}
  .stp-sep{display:none}
  .stp-sub{font-size:12px}
  .stp-tog-text{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
  .stp-grid{grid-template-columns:minmax(0,1fr)!important}
  .stp-li{display:grid!important;grid-template-columns:28px minmax(0,1fr);column-gap:12px}
  .stp-head{flex-direction:column!important}
  .stp-hline{display:none!important}
  .stp-vline{display:block!important}
  .stp-text{padding:3px 0 14px!important}
  .stp-actions{align-items:stretch!important;width:100%}
  .stp-actions > div{justify-content:flex-start!important}
  .rv-row{flex-wrap:wrap}
  .rv-row > a{margin-left:24px}
  .seg{display:flex!important;width:100%}
  .seg > *{flex:1 1 0;justify-content:center}
  .card{padding:16px!important}
}
</style>
<style>
.xb-bar{position:sticky;top:0;z-index:50;display:flex;flex-wrap:wrap;gap:4px 16px;align-items:center;padding:8px 16px;background:#141413;color:#fff;font:500 13px/1.4 -apple-system,BlinkMacSystemFont,'Segoe UI','Helvetica Neue',sans-serif}
.xb-bar a{color:#fff!important;text-underline-offset:3px}
.xb-bar a[aria-current]{font-weight:700;text-decoration:none;background:#fff;color:#000!important;padding:0 6px;border-radius:3px}
.xb-sib{margin-left:auto}
.xb-stage{background:hsl(30 6% 80%);min-height:100vh;padding:24px 16px 48px}
.xb-frame{margin:0 auto;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.2),0 12px 32px rgba(0,0,0,.15);overflow:hidden}
.xb-cap{margin:0 auto 10px;font:600 12px/1.4 -apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;color:#333;text-align:center}
</style>
</head>
<body>
<div class="xb-bar"><strong>Stepper · responsiv (Fensterbreite)</strong><span><a href="index.html">Übersicht</a> · <a href="vorher.html">Vorher</a> · <a href="nachher.html">Nachher</a> · <a href="stepper.html">Stepper</a></span><span class="xb-sib"><a href="stepper.html" aria-current="page">responsiv</a> · <a href="stepper-1280.html">1280</a> · <a href="stepper-1024.html">1024</a> · <a href="stepper-768.html">768</a> · <a href="stepper-640.html">640</a> · <a href="stepper-390.html">390</a> · <a href="stepper-druck-a4.html">A4</a></span></div>
<div id="dc-root"></div>
<template id="dc-tpl">

<div class="sp" style="container-type: inline-size; container-name: page; min-height: 100vh; background: hsl(33 100% 92%); color: #000; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Helvetica Neue', 'Noto Sans', sans-serif; font-size: 16px; line-height: 1.5; font-weight: 500">
<div class="pg-main" style="max-width: 64rem; margin: 0 auto; padding: 48px 16px; display: flex; flex-direction: column; gap: 28px">
  <sc-for list="{{cases}}" as="ph" hint-placeholder-count="14">
    <div style="display: flex; flex-direction: column; gap: 8px">
      <div style="display: flex; flex-wrap: wrap; align-items: center; gap: 4px 12px; min-height: 28px">
        <span style="font-size: 12px; font-weight: 700; letter-spacing: 0.04em; text-transform: uppercase; color: {{ph.capColor}}">{{ph.caption}}</span>
        <sc-if value="{{ph.resettable}}" hint-placeholder-val="{{false}}"><button type="button" class="ghost" onClick="{{ph.reset}}" style="min-height: 28px; padding: 0 8px; border: 0; border-radius: 5px; background: transparent; font-size: 12px; font-weight: 500; text-decoration: underline; text-underline-offset: 3px">Zurücksetzen</button></sc-if>
      </div>
      <div style="background: #fff; border: 2px solid #000; border-radius: 5px">
        <sc-if value="{{ph.collapsed}}" hint-placeholder-val="{{true}}">
          <div class="stp-crow" style="padding: 10px 12px 10px 20px; display: flex; flex-wrap: wrap; align-items: center; gap: 10px 16px">
            <ol class="stp-col" aria-label="Ablauf der Workshopwahl" style="flex: 999 1 420px; min-width: 0; list-style: none; margin: 0; padding: 0; display: flex; align-items: center">
              <sc-for list="{{ph.steps}}" as="st" hint-placeholder-count="4">
                <li aria-current="{{st.ariaCurrent}}" style="position: relative; display: flex; align-items: center; min-width: 0; flex: {{st.cFlex}}">
                  <sc-if value="{{st.done}}" hint-placeholder-val="{{false}}">
                    <span aria-hidden="true" style="width: 28px; height: 28px; flex: none; border: 2px solid #000; border-radius: 999px; background: #fff; display: flex; align-items: center; justify-content: center"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#000" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6 9 17l-5-5"></path></svg></span>
                  </sc-if>
                  <sc-if value="{{st.cur}}" hint-placeholder-val="{{false}}">
                    <span aria-hidden="true" style="width: 28px; height: 28px; flex: none; border: 2px solid #000; border-radius: 999px; background: #000; color: #fff; display: flex; align-items: center; justify-content: center; font-size: 14px; font-weight: 700"><sc-if value="{{st.curNum}}" hint-placeholder-val="{{true}}">{{st.n}}</sc-if><sc-if value="{{st.curCheck}}" hint-placeholder-val="{{false}}"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6 9 17l-5-5"></path></svg></sc-if></span>
                  </sc-if>
                  <sc-if value="{{st.fut}}" hint-placeholder-val="{{true}}">
                    <span aria-hidden="true" style="width: 28px; height: 28px; flex: none; border: 2px dashed hsl(30 10% 32%); border-radius: 999px; background: #fff; color: hsl(30 10% 32%); display: flex; align-items: center; justify-content: center; font-size: 14px; font-weight: 700">{{st.n}}</span>
                  </sc-if>
                  <sc-if value="{{st.cur}}" hint-placeholder-val="{{false}}">
                    <span class="stp-curlab" style="margin-left: 10px; min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; font-size: 14px"><span style="font-weight: 700">{{st.label}}</span><span class="stp-sep" style="font-weight: 400; color: hsl(30 10% 32%)"> · </span><span class="stp-sub" style="font-weight: 400; color: hsl(30 10% 32%)">{{st.sub}}</span></span>
                  </sc-if>
                  <sc-if value="{{st.notCur}}" hint-placeholder-val="{{true}}">
                    <span style="position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap">{{st.srText}}</span>
                  </sc-if>
                  <sc-if value="{{st.hasNext}}" hint-placeholder-val="{{true}}">
                    <span class="stp-cline" aria-hidden="true" style="flex: none; width: 28px; margin: 0 8px; border-top: 2px {{st.lineStyle}} {{st.lineColor}}"></span>
                  </sc-if>
                </li>
              </sc-for>
            </ol>
            <div style="display: flex; align-items: center; margin-left: auto">
              <button type="button" class="ghost" aria-expanded="{{ph.expandedStr}}" onClick="{{ph.toggle}}" style="flex: none; display: inline-flex; align-items: center; gap: 6px; min-height: 40px; padding: 0 10px; border: 0; border-radius: 5px; background: transparent; color: #000; font-size: 14px; font-weight: 500"><span class="stp-tog-text">{{ph.toggleText}}</span><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="transform: rotate({{ph.chev}}deg)"><path d="m6 9 6 6 6-6"></path></svg></button>
            </div>
          </div>
        </sc-if>
        <sc-if value="{{ph.expanded}}" hint-placeholder-val="{{false}}">
          <div style="padding: 16px 12px 16px 20px; display: flex; align-items: flex-start; gap: 16px; border-bottom: 1.5px solid hsl(33 25% 78%)">
            <ol class="stp-grid" aria-label="Ablauf der Workshopwahl" style="flex: 1; min-width: 0; list-style: none; margin: 0; padding: 0; display: grid; grid-template-columns: repeat(4, minmax(0, 1fr))">
              <sc-for list="{{ph.steps}}" as="st" hint-placeholder-count="4">
                <li class="stp-li" aria-current="{{st.ariaCurrent}}" style="min-width: 0">
                  <div class="stp-head" style="display: flex; align-items: center">
                    <sc-if value="{{st.done}}" hint-placeholder-val="{{false}}">
                      <span aria-hidden="true" style="width: 28px; height: 28px; flex: none; border: 2px solid #000; border-radius: 999px; background: #fff; display: flex; align-items: center; justify-content: center"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#000" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6 9 17l-5-5"></path></svg></span>
                    </sc-if>
                    <sc-if value="{{st.cur}}" hint-placeholder-val="{{false}}">
                      <span aria-hidden="true" style="width: 28px; height: 28px; flex: none; border: 2px solid #000; border-radius: 999px; background: #000; color: #fff; display: flex; align-items: center; justify-content: center; font-size: 14px; font-weight: 700"><sc-if value="{{st.curNum}}" hint-placeholder-val="{{true}}">{{st.n}}</sc-if><sc-if value="{{st.curCheck}}" hint-placeholder-val="{{false}}"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6 9 17l-5-5"></path></svg></sc-if></span>
                    </sc-if>
                    <sc-if value="{{st.fut}}" hint-placeholder-val="{{true}}">
                      <span aria-hidden="true" style="width: 28px; height: 28px; flex: none; border: 2px dashed hsl(30 10% 32%); border-radius: 999px; background: #fff; color: hsl(30 10% 32%); display: flex; align-items: center; justify-content: center; font-size: 14px; font-weight: 700">{{st.n}}</span>
                    </sc-if>
                    <sc-if value="{{st.hasNext}}" hint-placeholder-val="{{true}}">
                      <span class="stp-hline" aria-hidden="true" style="flex: 1; margin: 0 10px; border-top: 2px {{st.lineStyle}} {{st.lineColor}}"></span>
                      <span class="stp-vline" aria-hidden="true" style="display: none; flex: 1 1 auto; width: 0; min-height: 20px; margin: 4px 0; border-left: 2px {{st.lineStyle}} {{st.lineColor}}"></span>
                    </sc-if>
                  </div>
                  <div class="stp-text" style="padding: 8px 12px 0 0; display: flex; flex-direction: column">
                    <span style="font-size: 14px; line-height: 1.35; font-weight: {{st.labelWeight}}; color: {{st.labelColor}}">{{st.label}}<span style="position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap">{{st.srState}}</span></span>
                    <span style="font-size: 12px; font-weight: 400; color: hsl(30 10% 32%)">{{st.sub}}</span>
                  </div>
                </li>
              </sc-for>
            </ol>
            <button type="button" class="ghost" aria-expanded="{{ph.expandedStr}}" onClick="{{ph.toggle}}" style="flex: none; display: inline-flex; align-items: center; gap: 6px; min-height: 40px; padding: 0 10px; border: 0; border-radius: 5px; background: transparent; color: #000; font-size: 14px; font-weight: 500"><span class="stp-tog-text">{{ph.toggleText}}</span><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="transform: rotate({{ph.chev}}deg)"><path d="m6 9 6 6 6-6"></path></svg></button>
          </div>
          <div style="padding: 16px 20px; display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 16px">
            <div style="flex: 999 1 420px; min-width: 0; display: flex; flex-direction: column; gap: 4px">
              <h2 style="margin: 0; font-size: 18px; line-height: 1.35; font-weight: 700">{{ph.heading}}</h2>
              <p style="margin: 0; font-size: 14px; font-weight: 400">{{ph.text}}</p>
              <p style="margin: 0; font-size: 14px; font-weight: 400; color: hsl(30 10% 32%)">{{ph.note}}</p>
            </div>
            <div class="stp-actions" style="flex: none; display: flex; flex-direction: column; align-items: flex-end; gap: 8px">
              <div style="display: flex; flex-wrap: wrap; justify-content: flex-end; gap: 12px">
                <sc-for list="{{ph.actions}}" as="ac" hint-placeholder-count="1">
                  <sc-if value="{{ac.primary}}" hint-placeholder-val="{{true}}"><button type="button" class="press" onClick="{{ac.onClick}}" style="min-height: 40px; padding: 0 16px; border: 2px solid #000; border-radius: 5px; background: hsl(28 100% 51%); color: #000; font-size: 14px; font-weight: 700">{{ac.label}}</button></sc-if>
                  <sc-if value="{{ac.neutral}}" hint-placeholder-val="{{false}}"><button type="button" class="press" onClick="{{ac.onClick}}" style="min-height: 40px; padding: 0 16px; border: 2px solid #000; border-radius: 5px; background: #fff; color: #000; font-size: 14px; font-weight: 700">{{ac.label}}</button></sc-if>
                  <sc-if value="{{ac.disabled}}" hint-placeholder-val="{{false}}"><button type="button" disabled="{{true}}" style="min-height: 40px; padding: 0 16px; border: 2px dashed hsl(30 10% 32%); border-radius: 5px; background: hsl(30 8% 80%); color: hsl(30 10% 26%); font-size: 14px; font-weight: 700; cursor: not-allowed">{{ac.label}}</button></sc-if>
                  <sc-if value="{{ac.link}}" hint-placeholder-val="{{false}}"><a href="{{ac.href}}" class="press" style="display: inline-flex; align-items: center; gap: 6px; min-height: 40px; padding: 0 16px; border: 2px solid #000; border-radius: 5px; background: #fff; color: #000; font-size: 14px; font-weight: 700; text-decoration: none">{{ac.label}}<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12h14"></path><path d="m13 6 6 6-6 6"></path></svg></a></sc-if>
                </sc-for>
              </div>
            </div>
          </div>
          <sc-if value="{{ph.reviewOpen}}" hint-placeholder-val="{{false}}">
            <div role="region" aria-labelledby="review-h" style="margin: 0 20px 20px; border: 2px dashed #000; border-radius: 5px; background: hsl(33 100% 96%)">
              <div style="padding: 14px 16px 8px; display: flex; flex-direction: column; gap: 2px">
                <h3 id="review-h" style="margin: 0; font-size: 16px; font-weight: 700">{{ph.hintCount}} offene Hinweise</h3>
                <p style="margin: 0; font-size: 14px; font-weight: 400; color: hsl(30 10% 32%)">Behebe sie in der Liste oder nimm sie bewusst zur Kenntnis. Sie bleiben danach an den Workshops sichtbar.</p>
              </div>
              <ul style="list-style: none; margin: 0; padding: 0 16px">
                <sc-for list="{{ph.hints}}" as="h" hint-placeholder-count="5">
                  <li class="rv-row" style="display: flex; align-items: flex-start; gap: 8px; padding: 8px 0; border-top: 1.5px solid hsl(33 25% 78%); font-size: 14px; font-weight: 400">
                    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.25" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="flex: none; margin-top: 2px"><path d="M10.3 3.9 1.8 18a2 2 0 0 0 1.7 3h17a2 2 0 0 0 1.7-3L13.7 3.9a2 2 0 0 0-3.4 0z"></path><path d="M12 9v4"></path><path d="M12 17h.01"></path></svg>
                    <span style="flex: 1; min-width: 0"><span style="font-weight: 700">{{h.ws}}</span> · {{h.text}}</span>
                    <a href="#" style="flex: none; font-size: 14px; font-weight: 500; text-underline-offset: 3px">Zum Workshop</a>
                  </li>
                </sc-for>
              </ul>
              <p style="margin: 0; padding: 8px 16px; border-top: 1.5px solid hsl(33 25% 78%); font-size: 14px; font-weight: 400">+ {{ph.moreHints}} weitere · <a href="#" style="font-weight: 500; text-underline-offset: 3px">Alle in der Liste zeigen</a></p>
              <div style="padding: 12px 16px 16px; display: flex; flex-wrap: wrap; justify-content: flex-end; gap: 12px; border-top: 1.5px solid hsl(33 25% 78%)">
                <button type="button" class="press" onClick="{{ph.onCancel}}" style="min-height: 40px; padding: 0 16px; border: 2px solid #000; border-radius: 5px; background: #fff; color: #000; font-size: 14px; font-weight: 700">Abbrechen</button>
                <button type="button" class="press" onClick="{{ph.onConfirm}}" style="min-height: 40px; padding: 0 16px; border: 2px solid #000; border-radius: 5px; background: hsl(28 100% 51%); color: #000; font-size: 14px; font-weight: 700">Zur Kenntnis genommen</button>
              </div>
            </div>
          </sc-if>
        </sc-if>
      </div>
    </div>
  </sc-for>
</div>
</div>
</template>
<script type="text/plain" id="dc-logic">
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { demo: 'open', demoCollapsed: false };
  }
  buildPhase(c, collapsed, toggle, opts) {
  opts = opts || {};
  var M = 'hsl(30 10% 32%)';
  var hints = opts.hints == null ? 13 : opts.hints, ack = !!opts.ack;
  var s3 = hints === 0 ? 'Keine offenen Hinweise' : (ack ? hints + ' Hinweise zur Kenntnis genommen' : hints + ' Hinweise offen');
  var defs = [
    ['Workshops anlegen', '33 Workshops angelegt', '33 Workshops angelegt'],
    ['Wahl öffnen', 'Geöffnet am 15. April 2027', 'Zieltermin: 15. April 2027'],
    ['Zuordnung prüfen', 'Alle Hinweise erledigt', s3],
    ['Festgelegt', 'Für Familien sichtbar', 'Ergebnis für Familien festlegen']
  ];
  var steps = defs.map(function (d, i) {
    var n = i + 1, done = n < c, cur = n === c, fut = n > c;
    return {
      n: n, label: d[0], sub: (done || (cur && n === 4)) ? d[1] : d[2],
      done: done, cur: cur, fut: fut, notCur: !cur, hasNext: n < 4,
      lineStyle: n + 1 <= c ? 'solid' : 'dashed', lineColor: n + 1 <= c ? '#000' : M,
      curNum: cur && n < 4, curCheck: cur && n === 4,
      labelWeight: cur ? 700 : 500, labelColor: fut ? M : '#000',
      ariaCurrent: cur ? 'step' : 'false',
      srText: 'Schritt ' + n + ': ' + d[0] + (done ? ', erledigt' : ', offen'),
      srState: done ? ' (erledigt)' : (fut ? ' (offen)' : ' (aktuell)'),
      cFlex: cur ? '0 1 auto' : 'none'
    };
  });
  function act(kind, label, href, onClick) { return { label: label, href: href || '#', onClick: onClick || function () {}, primary: kind === 'primary', neutral: kind === 'neutral', disabled: kind === 'disabled', link: kind === 'link' }; }
  var review = !!opts.review, p;
  if (c === 1) p = ['Nächster Schritt: Workshops anlegen', 'Lege alle Workshops mit Zielgruppe, Leitung und Plätzen an.', 'Familien sehen noch nichts.', [act('link', 'Workshops anlegen', '#workshopliste')]];
  else if (c === 2) p = ['Nächster Schritt: Wahl öffnen', 'Workshopdaten sind vorhanden. Prüfe Zielgruppen und Leitungen, bevor du die Wahl öffnest.', 'Familien sehen noch keine Workshops, bis die Wahl geöffnet ist.', [act('primary', 'Wahl öffnen')]];
  else if (c === 3 && hints > 0 && !ack) p = ['Nächster Schritt: Hinweise prüfen', 'Die Wahl ist geschlossen. ' + hints + ' Hinweise sind offen, z. B. überbuchte Workshops. Prüfe sie, bevor du das Ergebnis festlegst.', 'Familien sehen „Zuordnung läuft“, bis das Ergebnis festgelegt ist.', review ? [] : [act('primary', hints + ' Hinweise prüfen', null, opts.onReview), act('neutral', 'Ergebnis festlegen', null, opts.onReview)]];
  else if (c === 3 && hints > 0) p = ['Nächster Schritt: Ergebnis festlegen', hints + ' Hinweise sind zur Kenntnis genommen und bleiben an den Workshops sichtbar.', 'Mit dem Festlegen sehen Familien ihre Workshops. Danach sind Änderungen nur noch einzeln möglich.', [act('neutral', hints + ' Hinweise prüfen'), act('primary', 'Ergebnis festlegen')]];
  else if (c === 3) p = ['Nächster Schritt: Ergebnis festlegen', 'Alle Hinweise sind erledigt.', 'Mit dem Festlegen sehen Familien ihre Workshops. Danach sind Änderungen nur noch einzeln möglich.', [act('primary', 'Ergebnis festlegen')]];
  else p = ['Festgelegt', 'Das Ergebnis ist festgelegt und für Familien sichtbar.', 'Festgelegt am 2. Mai 2027. Änderungen sind nur noch einzeln möglich.', []];
  var hintList = [
    { ws: 'Keramik', text: 'Zielgruppe „Erwachsene“ passt nicht zum Alter 5–14 Jahre.' },
    { ws: 'Spielewerkstatt', text: 'Eine Leitung (ID „per_p2“) ist keiner Person zugeordnet.' },
    { ws: 'Kletterwand', text: '32 Wünsche für 12 Plätze.' },
    { ws: 'Erste Hilfe am Kind', text: '34 Wünsche für 14 Plätze.' },
    { ws: 'Zirkus', text: 'Noch nicht eingeplant.' }
  ];
  return {
    steps: steps, collapsed: collapsed, expanded: !collapsed,
    expandedStr: collapsed ? 'false' : 'true',
    toggleText: collapsed ? 'Alle Schritte' : 'Weniger',
    chev: collapsed ? 0 : 180, toggle: toggle,
    heading: p[0], text: p[1], note: p[2], actions: p[3],
    reviewOpen: c === 3 && hints > 0 && !ack && review,
    hints: hintList, hintCount: hints, moreHints: hints - hintList.length,
    onConfirm: opts.onConfirm || function () {}, onCancel: opts.onCancel || function () {}
  };
}
  renderVals() {
    var self = this, s = this.state;
    var demo = this.buildPhase(3, s.demoCollapsed, function () { self.setState({ demoCollapsed: !self.state.demoCollapsed }); }, {
      hints: 13, review: s.demo === 'review', ack: s.demo === 'confirmed',
      onReview: function () { self.setState({ demo: 'review' }); },
      onConfirm: function () { self.setState({ demo: 'confirmed' }); },
      onCancel: function () { self.setState({ demo: 'open' }); }
    });
    demo.caption = 'Zum Durchklicken · Schritt 3 mit 13 Hinweisen'; demo.capColor = '#000';
    demo.resettable = true; demo.reset = function () { self.setState({ demo: 'open', demoCollapsed: false }); };
    var defs = [
      [1, {}, 'Schritt 1 · Workshops anlegen', 'both'],
      [2, {}, 'Schritt 2 · Wahl öffnen (heute)', 'both'],
      [3, { hints: 13 }, 'Schritt 3 · 13 Hinweise offen', 'both'],
      [3, { hints: 13, review: true }, 'Schritt 3 · Hinweise inline geöffnet', 'expanded'],
      [3, { hints: 13, ack: true }, 'Schritt 3 · Hinweise zur Kenntnis genommen', 'both'],
      [3, { hints: 0 }, 'Schritt 3 · keine Hinweise', 'both'],
      [4, {}, 'Schritt 4 · Festgelegt', 'both']
    ];
    var cases = [demo];
    defs.forEach(function (d) {
      if (d[3] === 'both') { var a = self.buildPhase(d[0], true, null, d[1]); a.caption = d[2] + ' · eingeklappt'; a.capColor = 'hsl(30 10% 32%)'; cases.push(a); }
      var b = self.buildPhase(d[0], false, null, d[1]); b.caption = d[2] + (d[3] === 'both' ? ' · ausgeklappt' : ''); b.capColor = 'hsl(30 10% 32%)'; cases.push(b);
    });
    return { cases: cases };
  }
}

<script>/* dc-lite: minimal standalone renderer for the .dc.html mockups ({{holes}}, sc-for, sc-if, events, setState). */
(function () {
  function schedule() {
    if (queued) return;
    queued = true;
    requestAnimationFrame(function () { queued = false; render(); });
  }
  class DCLogic {
    constructor(props) { this.props = props || {}; this.state = {}; }
    setState(u) {
      var n = typeof u === 'function' ? u(this.state, this.props) : u;
      Object.assign(this.state, n);
      schedule();
    }
    forceUpdate() { schedule(); }
  }
  var queued = false;
  var code = document.getElementById('dc-logic').textContent;
  var Component = new Function('DCLogic', code + '\n;return Component;')(DCLogic);
  var comp = new Component({});
  if (!comp.state) comp.state = {};
  var tpl = document.getElementById('dc-tpl').content;
  var root = document.getElementById('dc-root');
  var HOLE = /\{\{\s*([^}]+?)\s*\}\}/g, WHOLE = /^\s*\{\{\s*([^}]+?)\s*\}\}\s*$/;

  function look(path, scope) {
    path = path.trim();
    if (path === 'true') return true;
    if (path === 'false') return false;
    if (path === 'null') return null;
    if (/^-?\d+(\.\d+)?$/.test(path)) return Number(path);
    if (/^(['"]).*\1$/.test(path)) return path.slice(1, -1);
    var parts = path.split('.'), v = scope;
    for (var i = 0; i < parts.length; i++) { if (v == null) return undefined; v = v[parts[i]]; }
    return v;
  }
  function interp(str, scope) {
    return str.replace(HOLE, function (_, p) { var v = look(p, scope); return v == null ? '' : String(v); });
  }
  function kids(node, scope, parent) {
    node.childNodes.forEach(function (c) { build(c, scope, parent); });
  }
  function build(node, scope, parent) {
    if (node.nodeType === 3) { parent.appendChild(document.createTextNode(interp(node.nodeValue, scope))); return; }
    if (node.nodeType !== 1) return;
    var tag = node.localName;
    if (tag === 'helmet') return;

      var list = m ? look(m[1], scope) : [];
      var as = node.getAttribute('as') || 'item';
      (list || []).forEach(function (item, i) {
        var s = Object.create(scope); s[as] = item; s.$index = i; kids(node, s, parent);
      });
      return;
    }
    if (tag === 'sc-if') {
      var m2 = WHOLE.exec(node.getAttribute('value') || '');

    var el = document.createElementNS(node.namespaceURI, tag);
    Array.prototype.forEach.call(node.attributes, function (a) {
      var name = a.name, val = a.value;
      if (name.indexOf('hint-') === 0) return;
      var w = WHOLE.exec(val);
      if (name.length > 2 && name.slice(0, 2) === 'on') {
        if (w) { var fn = look(w[1], scope); if (typeof fn === 'function') el.addEventListener(name.slice(2), fn); }
        return;
      }

        if (name === 'disabled' || name === 'readonly' || name === 'hidden') { if (v) el.setAttribute(name, ''); return; }

      el.setAttribute(name, val.indexOf('{{') >= 0 ? interp(val, scope) : val);

    var vals = comp.renderVals();
    var frag = document.createDocumentFragment();
    kids(tpl, vals, frag);

    root.querySelectorAll('nav').forEach(function (nav) {
      var a = nav.querySelector('[aria-current="page"]');

</script>
