<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#fff0d6">
<title>Familien – Familienfreizeit</title>
<style>
*,*::before,*::after{box-sizing:border-box}
:root{
  --bg:hsl(33 100% 92%);--surface:#fff;--paper:#fffaf0;--ink:#000;--muted:hsl(30 10% 32%);--rule:hsl(33 25% 82%);--off:hsl(30 12% 88%);
  --main:hsl(28 100% 51%);--danger:hsl(2 90% 66%);--line:var(--ink);--shadow:3px 3px 0 0 var(--line);--r:6px;
  --font:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue","Noto Sans",Arial,sans-serif;
  color-scheme:light;
  padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:hsl(30 14% 9%);--surface:hsl(30 12% 14%);--paper:hsl(30 12% 18%);--ink:hsl(36 60% 93%);--muted:hsl(33 18% 72%);--rule:hsl(30 10% 32%);--off:hsl(30 8% 26%);
    --main:hsl(28 100% 56%);--danger:hsl(2 85% 66%);color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:hsl(30 14% 9%);--surface:hsl(30 12% 14%);--paper:hsl(30 12% 18%);--ink:hsl(36 60% 93%);--muted:hsl(33 18% 72%);--rule:hsl(30 10% 32%);--off:hsl(30 8% 26%);
  --main:hsl(28 100% 56%);--danger:hsl(2 85% 66%);color-scheme:dark;
}
html{scroll-padding-top:calc(env(safe-area-inset-top,0px) + 16px);-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--font);font-size:16px;line-height:1.55;overflow-x:hidden}
[hidden]{display:none!important}
h1,h2,h3,h4,h5,p,ul,ol,fieldset,legend{margin:0;padding:0}
h1,h2,h3,h4,h5{font-weight:700;line-height:1.25;overflow-wrap:anywhere}
ul,ol{list-style:none}
fieldset{border:0;min-width:0}
a{color:inherit;text-underline-offset:4px}
button,input,select,textarea{font:inherit;color:inherit}
:where(a,button,input,summary,select,textarea):focus-visible{outline:3px solid var(--line);outline-offset:3px}
[tabindex="-1"]:focus{outline:none}
[tabindex="-1"]:focus-visible{outline:3px solid var(--line);outline-offset:4px}
.sr-only{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip-path:inset(50%);white-space:nowrap;border:0}
.muted{color:var(--muted)}
.hint{font-size:14px;color:var(--muted);max-width:64ch}
.opt{font-weight:500;color:var(--muted)}
.icon{width:16px;height:16px;flex-shrink:0}

.skip{position:absolute;left:12px;top:-80px;z-index:50;background:var(--ink);color:var(--surface);padding:12px 16px;border-radius:var(--r);font-weight:700}
.skip:focus{top:calc(env(safe-area-inset-top,0px) + 12px)}

/* Prototype-only controls */
.proto-wrap{max-width:72rem;margin:0 auto;padding:12px 16px 0}
@media (min-width:600px){.proto-wrap{padding:12px 32px 0}}
details.proto{border:2px dashed var(--muted);border-radius:var(--r);font-size:14px}
details.proto summary{min-height:44px;display:flex;align-items:center;padding:0 12px;font-weight:700;cursor:pointer}
.proto-body{display:flex;flex-wrap:wrap;align-items:center;gap:4px 24px;padding:0 12px 10px}
.proto label{display:flex;align-items:center;gap:10px;min-height:44px;cursor:pointer}
.proto input[type=checkbox]{width:20px;height:20px;accent-color:var(--ink)}
.proto button{min-height:44px;border:1.5px dashed var(--muted);border-radius:3px;background:transparent;padding:4px 10px;cursor:pointer}

/* Top bar */
.topbar{background:var(--surface);border-bottom:2px solid var(--line);margin-top:12px}
.topbar-in{max-width:72rem;margin:0 auto;padding:12px 16px;display:flex;flex-wrap:wrap;align-items:center;gap:12px 24px}
@media (min-width:600px){.topbar-in{padding:12px 32px}}
.brand a{font-size:20px;font-weight:700;text-decoration:none;display:inline-flex;min-height:44px;align-items:center}
.brand p{font-size:14px;color:var(--muted);margin-top:-8px}
.nav{display:flex;flex-wrap:wrap;gap:8px}
.nav a{display:inline-flex;align-items:center;min-height:44px;padding:0 16px;border:2px solid transparent;border-radius:var(--r);font-weight:700;text-decoration:none}
.nav a:hover{border-color:var(--line)}
.nav a[aria-current="page"]{background:var(--ink);color:var(--surface);border-color:var(--line)}

/* Page */
.wrap{max-width:72rem;margin:0 auto;padding:24px 16px 72px}
@media (min-width:600px){.wrap{padding:32px 32px 96px}}
main:focus{outline:none}
.page-head{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:16px;padding-bottom:20px;border-bottom:2px solid var(--line);margin-bottom:16px}
h1{font-size:clamp(28px,8vw,36px)}
h2{font-size:22px}
.crumbs a{display:inline-flex;align-items:center;gap:4px;min-height:44px;font-weight:700}
.meta a{display:inline-flex;align-items:center;gap:6px;min-height:44px}
.actions{display:flex;flex-wrap:wrap;gap:10px}
.stack{display:grid;gap:28px}
.stack-sm{display:grid;gap:16px}

/* Buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:44px;padding:8px 16px;max-width:100%;border:2px solid var(--line);border-radius:var(--r);background:var(--surface);color:var(--ink);font-size:15px;font-weight:700;line-height:1.25;text-align:center;cursor:pointer;box-shadow:var(--shadow);transition:translate 120ms,box-shadow 120ms;text-decoration:none}
.btn:hover,.btn:active{translate:3px 3px;box-shadow:none}
.btn.main{background:var(--main);color:#000}
.btn.danger{background:var(--danger);color:#000}
.btn.plain{box-shadow:none}
.btn.plain:hover{translate:none;background:var(--paper)}
.btn.icon-only{width:44px;padding:0}
.btn[aria-disabled="true"]{background:var(--off);border-color:var(--muted);color:var(--muted);box-shadow:none;translate:none;cursor:not-allowed}
.btn[aria-pressed="true"]{background:var(--ink);color:var(--surface)}

/* Chips and badges */
.chip{display:inline-flex;align-items:center;gap:6px;min-height:28px;padding:2px 8px;border:2px solid var(--line);border-radius:var(--r);background:var(--surface);font-size:14px;font-weight:700;line-height:1.25;max-width:100%}
.chip.attn{background:var(--main);color:#000;border-color:#000}
.chip.bad{background:var(--danger);color:#000;border-color:#000}
.chip.off{background:var(--off);border-color:var(--muted)}
.chip.free{border-style:dashed}
.chip.dark{background:var(--ink);color:var(--surface)}
.chip.plan{background:var(--paper);border-style:dotted}
.chip.maybe{border-style:dashed;background:var(--surface);color:var(--ink);font-weight:700}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.badge{display:inline-flex;align-items:center;gap:6px;min-height:26px;padding:0 8px;border:1.5px solid var(--muted);border-radius:var(--r);background:var(--surface);font-size:14px}
.spinner{display:inline-block;width:16px;height:16px;flex:none;border:3px solid var(--rule);border-top-color:var(--ink);border-radius:50%;animation:spin 900ms linear infinite}
@keyframes spin{to{rotate:360deg}}

/* Save bar + alerts */
.savebar{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;margin:0 -16px 16px;padding:8px 16px;background:var(--bg);border-bottom:2px solid var(--line)}
@media (min-width:600px){.savebar{margin:0 -32px 16px;padding:8px 32px}}
.save{display:inline-flex;align-items:center;gap:8px;min-height:36px;padding:2px 12px;border:2px solid var(--line);border-radius:var(--r);background:var(--surface);font-weight:700;font-size:15px}
.save .sico{display:inline-grid;place-items:center;width:20px;height:20px;flex:none}
.save.idle{border-style:dashed;font-weight:500;border-color:var(--muted)}
.save.saving{background:var(--paper)}
.save.failed{background:var(--danger);color:#000;border-color:#000}
.alert{border:2px solid var(--line);border-left-width:10px;border-radius:var(--r);background:var(--surface);padding:12px 14px;display:grid;gap:4px}
.alert.attn{border-left-color:var(--main)}
.alert.bad{border-left-color:var(--danger)}
.alert-h{font-weight:700;font-size:17px}
.alert .actions{margin-top:8px}
.tried-text{display:block;margin-top:4px;padding:6px 10px;white-space:pre-wrap;overflow-wrap:anywhere;border:1.5px dashed var(--muted);border-radius:3px;background:var(--paper)}
.open-list{display:grid;gap:10px;margin-top:8px}
.open-list li{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:8px 16px;padding-top:10px;border-top:1px solid var(--rule)}
.open-list li:first-child{border-top:0;padding-top:0}
.done-line{display:flex;align-items:center;gap:10px;padding:10px 14px;border:2px solid var(--line);border-radius:var(--r);background:var(--surface);font-weight:700}

/* Cards */
.card{border:2px solid var(--line);border-radius:var(--r);background:var(--surface);box-shadow:var(--shadow);padding:16px;display:grid;gap:14px;min-width:0}
.card-head{display:flex;flex-wrap:wrap;align-items:flex-start;justify-content:space-between;gap:8px 12px}
.card h4{font-size:19px}
.card h5{font-size:16px}
.field{display:grid;gap:6px;min-width:0}
.field>label,.field>legend{font-weight:700;font-size:16px;line-height:1.3}
.field>legend{margin-bottom:6px}
.fhead{display:flex;flex-wrap:wrap;align-items:center;gap:6px 12px;min-height:28px}
.fhead:empty{display:none}

/* Option buttons (radios styled like the workshop prototype's filter buttons) */
.opts{display:flex;flex-wrap:wrap;gap:8px}
.opts label{position:relative;display:inline-flex;align-items:center;gap:6px;min-height:44px;padding:8px 14px;border:2px solid var(--line);border-radius:var(--r);background:var(--surface);font-weight:700;font-size:15px;line-height:1.25;cursor:pointer}
.opts input{position:absolute;inset:0;width:100%;height:100%;opacity:0;margin:0;cursor:pointer}
.opts label:hover{background:var(--paper)}
.opts label:has(input:checked){background:var(--ink);color:var(--surface)}
.opts label:has(input:checked)::before{content:"✓";font-weight:700}
.opts label:has(input:focus-visible){outline:3px solid var(--line);outline-offset:3px}

input[type=text],input[type=email],input[type=search],input[type=date],select,textarea{width:100%;margin:0;border:2px solid var(--line);border-radius:var(--r);background:var(--surface);color:var(--ink);font-size:16px;line-height:1.4}
input[type=text],input[type=email],input[type=search],input[type=date],select{min-height:48px;padding:0 12px}
textarea{display:block;min-height:110px;padding:10px 12px;resize:vertical;white-space:pre-wrap;overflow-wrap:anywhere}
[aria-invalid="true"]{border-color:var(--danger)!important;box-shadow:0 0 0 2px var(--danger)}
.error{font-size:14px;font-weight:700}
.error:empty{display:none}
.st-quiet{font-size:15px;color:var(--muted)}

.toggle,.check{display:inline-flex;align-items:center;gap:10px;min-height:44px;cursor:pointer;font-weight:700}
.toggle input{appearance:none;-webkit-appearance:none;margin:0;width:52px;height:30px;border:2px solid var(--line);border-radius:999px;background:var(--paper);position:relative;cursor:pointer;flex-shrink:0;transition:background-color 120ms}
.toggle input::before{content:"";position:absolute;top:2px;left:2px;width:22px;height:22px;border-radius:999px;background:var(--surface);border:2px solid var(--line);transition:translate 120ms}
.toggle input:checked{background:var(--main)}
.toggle input:checked::before{translate:22px 0}
.check input{width:22px;height:22px;margin:0;accent-color:var(--ink);flex-shrink:0}

/* People: person list + person view */
.ppl-sec{container-type:inline-size;container-name:ppl}
.sec-row{display:flex;flex-wrap:wrap;align-items:baseline;gap:4px 12px;margin-bottom:12px}
.ppl{display:grid;gap:24px;align-items:start}
.ptabs{display:grid;gap:10px}
.ptab{display:grid;gap:2px;width:100%;min-height:64px;padding:12px 14px;text-align:left;border:2px solid var(--line);border-radius:var(--r);background:var(--surface);color:var(--ink);cursor:pointer}
.ptab:hover{background:var(--paper)}
.ptab[aria-selected="true"]{background:var(--ink);color:var(--surface);box-shadow:var(--shadow)}
.ptab[aria-selected="true"] .badge{border-color:var(--surface);color:var(--ink)}
.ptab[aria-selected="true"] .ptab-age{color:var(--surface)}
.ptab-top{display:flex;flex-wrap:wrap;align-items:baseline;justify-content:space-between;gap:0 10px}
.ptab-name{font-weight:700;font-size:17px;overflow-wrap:anywhere}
.ptab-age{font-size:14px;color:var(--muted)}
.ptab .chips{margin-top:6px}
.add-person{margin-top:14px}
.empty-inline{padding:16px;border:2px dashed var(--muted);border-radius:var(--r)}
@container ppl (min-width:760px){.ppl{grid-template-columns:minmax(220px,280px) minmax(0,1fr);gap:28px}}

.pview{container-type:inline-size;container-name:pview;min-width:0;scroll-margin-top:16px}
.av{display:grid;place-items:center;width:56px;height:56px;flex:none;border:2px solid #000;border-radius:50%;background:var(--main);color:#000;font-weight:700;font-size:24px}
.phead{display:flex;flex-wrap:wrap;align-items:center;gap:10px 14px;margin-bottom:10px}
.phead h3{font-size:26px}
.phead-actions{margin-left:auto}
.subtabs{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:12px 0 20px;padding-bottom:16px;border-bottom:2px solid var(--line)}
.subtab{min-height:56px;padding:6px 12px;border:2px solid var(--line);border-radius:var(--r);background:var(--surface);color:var(--ink);text-align:left;cursor:pointer;line-height:1.25}
.subtab .t{display:block;font-weight:700;font-size:16px}
.subtab .s{display:block;font-size:13px}
.subtab[aria-selected="true"]{background:var(--ink);color:var(--surface)}
.subtab:not([aria-selected="true"]):hover{background:var(--paper)}
.nextp{display:flex;flex-wrap:wrap;gap:10px;margin-top:28px;padding-top:16px;border-top:2px solid var(--line)}

/* Ranking (from the workshop prototype) */
.rklist{display:grid;gap:10px}
.rk{display:grid;grid-template-columns:36px 1fr;align-items:center;gap:8px 12px;padding:12px;border:2px solid var(--line);border-radius:var(--r);background:var(--surface)}
.rk.empty{border-style:dashed;border-color:var(--muted);background:transparent;color:var(--muted);align-items:center}
.rk-slot{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:8px 12px;min-width:0}
.rk.empty .rk-slot>span{color:var(--muted)}
.rk-n{display:grid;place-items:center;width:36px;height:36px;border:2px solid #000;border-radius:50%;background:var(--main);color:#000;font-weight:700}
.rk.empty .rk-n{background:var(--surface);border-style:dashed;border-color:var(--muted);color:var(--muted)}
.rk-body{min-width:0;display:grid;gap:4px}
.rk-body>.chip{justify-self:start}
.rk-body strong{font-size:17px;overflow-wrap:anywhere}
.rk-ctl{display:flex;flex-wrap:wrap;align-items:center;gap:8px 12px;margin-left:auto}
.numctl{display:flex;align-items:center;gap:6px}
.numctl .lbl{font-size:14px;font-weight:700;margin-right:2px}
.num{width:44px;height:44px;border:2px solid var(--line);border-radius:var(--r);background:var(--surface);font-weight:700;font-size:16px;cursor:pointer}
.num[aria-pressed="true"]{background:var(--ink);color:var(--surface)}
.plist{display:grid;gap:8px;margin-top:8px}
.plist li{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:8px 12px;padding:8px 8px 8px 12px;border:2px solid var(--line);border-radius:var(--r)}

/* Workshop catalogue */
.filters{display:grid;gap:14px;margin-bottom:14px}
.filters label.fl,.filters legend{display:block;font-weight:700;font-size:15px;margin-bottom:6px}
.seg{display:flex;flex-wrap:wrap;gap:8px}
.seg .btn{box-shadow:none}
.seg .btn:hover{translate:none;background:var(--paper)}
.seg .btn[aria-pressed="true"]:hover{background:var(--ink)}
.count{font-size:15px;margin-bottom:12px;font-weight:700}
.wlist{display:grid;gap:16px}
.wcard{border:2px solid var(--line);border-radius:var(--r);background:var(--surface);box-shadow:var(--shadow);padding:16px;display:grid;gap:10px;align-content:start;min-width:0}
.wcard.inelig{border-style:dashed;border-color:var(--muted);box-shadow:none;background:var(--paper)}
.wcard h4{font-size:19px}
.w-top{display:grid;gap:8px}
.modeinfo{font-size:14px;color:var(--muted)}
.inel{border-left:4px solid var(--muted);padding-left:10px;font-size:15px}
.places{display:flex;flex-wrap:wrap;align-items:center;gap:6px 10px;font-variant-numeric:tabular-nums}
.seats{display:flex;flex-wrap:wrap;gap:3px}
.seat{width:12px;height:12px;border:2px solid var(--line);border-radius:2px;background:var(--surface)}
.seat.taken{background:var(--ink)}
.wact{display:flex;flex-wrap:wrap;align-items:center;gap:8px 10px}
.empty-state{border:2px dashed var(--muted);border-radius:var(--r);padding:20px;display:grid;gap:10px;justify-items:start}

@container pview (min-width:560px){.subtabs{display:flex}.subtab{min-width:200px}}
@container pview (min-width:640px){
  .filters{grid-template-columns:minmax(0,1fr) auto}
  .filters{grid-template-columns:1fr 1fr}
  .filters .full{grid-column:1/-1}
  .wlist{grid-template-columns:1fr 1fr;align-items:start}
}

/* List */
.toolbar{display:flex;flex-wrap:wrap;gap:12px;align-items:center;margin-bottom:10px}
.search{position:relative;flex:1 1 16rem;max-width:26rem}
.search .icon{position:absolute;left:13px;top:50%;translate:0 -50%;pointer-events:none}
.search input{padding-left:38px}
.result-count{margin-bottom:12px;font-size:14px;color:var(--muted)}
.lcard{background:var(--surface);border:2px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow)}
.table-scroll{overflow-x:auto}
.ftable{width:100%;border-collapse:collapse;text-align:left}
.ftable thead th{padding:12px 16px;border-bottom:2px solid var(--line);font-size:14px;white-space:nowrap}
.ftable td,.ftable tbody th{padding:14px 16px;vertical-align:top;font-weight:400}
.ftable tbody tr{border-top:1px solid var(--line)}
.ftable tbody tr:first-child{border-top:0}
.ftable tbody tr:hover{background:var(--paper)}
.cell{display:grid;gap:6px;justify-items:start}
.sub{display:block;font-size:14px;color:var(--muted)}
.rowlink{font-weight:700;font-size:17px}
.ftable tbody tr.rowclick{cursor:pointer}
.ftable tbody tr.rowclick:has(.rowlink:focus-visible){outline:3px solid var(--line);outline-offset:-3px}
.rowlink:focus-visible{outline:none;text-decoration-thickness:3px}
.empty{padding:32px 24px;display:grid;gap:12px;justify-items:start}
@media (max-width:47.99rem){
  .ftable thead{display:none}
  .ftable,.ftable tbody,.ftable tr{display:block}
  .ftable tbody tr{padding:12px 16px}
  .ftable td{display:flex;justify-content:space-between;gap:16px;padding:6px 0}
  .ftable tbody th{display:block;padding:0 0 8px}
  .ftable td::before{content:attr(data-label);font-weight:700;font-size:14px;flex:none}
  .ftable td .cell{justify-items:end;text-align:right}
}


/* Topic tabs (underline style, from the Räume/Slots heading) */
.ttabs-bar{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:0 24px;border-bottom:2px solid color-mix(in srgb,var(--line) 30%,transparent)}
@media (max-width:39.99rem){.ttabs-bar{flex-direction:column;align-items:stretch}}
.ttabs{display:flex;flex-wrap:wrap;gap:4px 20px}
.ttab{display:inline-flex;align-items:center;gap:8px;min-height:44px;padding:8px 2px 4px;border:0;border-bottom:4px solid transparent;background:none;color:var(--muted);font-weight:700;font-size:18px;text-align:left;cursor:pointer}
.ttab[aria-selected="true"]{border-bottom-color:var(--line);color:var(--ink)}
.ttab:focus-visible{outline:none;box-shadow:0 0 0 2px var(--bg),0 0 0 4px var(--line)}
.ttab .chip{min-height:22px;padding:0 6px;font-size:13px}
.scope{font-size:14px;color:var(--muted);padding:6px 0}
.tpanel{padding-top:20px}

/* Roster */
.roster-card{container-type:inline-size;container-name:roster}
.roster li{display:grid;grid-template-columns:minmax(0,1fr);gap:8px 12px;align-items:center;padding:12px 0;border-top:1px solid var(--rule)}
.roster li:first-child{border-top:0;padding-top:0}
.roster li:last-child{padding-bottom:0}
.r-name{display:grid;gap:2px;justify-items:start;min-width:0}
.r-name strong{font-size:17px;overflow-wrap:anywhere}
.r-ctl{grid-column:1/-1;display:flex;flex-wrap:wrap;align-items:center;gap:6px 14px}
.r-ctl .actions{gap:6px}
@container roster (min-width:560px){.roster li{grid-template-columns:minmax(0,1fr) auto}.r-ctl{grid-column:auto;justify-content:flex-end}}
.roster li.away .r-name strong{color:var(--muted)}
.av.sm{width:40px;height:40px;font-size:17px}
.who{display:flex;align-items:center;gap:12px;min-width:0}
.who h3{font-size:20px}

/* Text save controls */
.tctl{display:flex;flex-wrap:wrap;align-items:center;gap:8px 12px}
.btn:disabled{background:var(--off);border-color:var(--muted);color:var(--muted);box-shadow:none;translate:none;cursor:not-allowed}
.beds{display:flex;flex-wrap:wrap;align-items:baseline;gap:4px 10px}
.beds strong{font-size:30px;line-height:1}
input[type=number]{min-height:48px;padding:0 12px;width:8rem;border:2px solid var(--line);border-radius:var(--r);background:var(--surface);color:var(--ink);font-size:16px}


/* Person sidebar shared by Personen, Essen and Workshops */
.pl{container-type:inline-size;container-name:pl}
.pl-grid{display:grid;gap:20px;align-items:start}
.pside{display:grid;gap:12px;align-content:start;min-width:0}
.pside>.btn{justify-self:start}
.plist{display:grid;gap:8px}
.pbtn{display:grid;justify-items:start;gap:2px;width:100%;min-height:52px;padding:10px 12px;text-align:left;border:2px solid var(--line);border-radius:var(--r);background:var(--surface);color:var(--ink);cursor:pointer;min-width:0}
.pbtn:hover{background:var(--paper)}
.pbtn[aria-selected="true"]{background:var(--ink);color:var(--surface);box-shadow:var(--shadow)}
.pbtn.new{border-style:dashed}
.pbtn .chip{margin-top:6px;background:var(--surface);color:var(--ink)}
.pb-name{font-weight:700;font-size:16px;line-height:1.25;overflow-wrap:anywhere}
.pb-sub{font-size:13px;color:var(--muted);line-height:1.3}
.pbtn[aria-selected="true"] .pb-sub{color:var(--surface)}
.pside>.btn{justify-self:stretch}
@container pl (min-width:720px){
  .pl-grid{grid-template-columns:minmax(190px,23%) minmax(0,1fr);gap:28px}
  .pside{position:sticky;top:calc(env(safe-area-inset-top,0px) + 16px)}
  .pside>.btn{justify-self:start}
}
.lbl-h{font-size:19px!important;font-weight:700}
.findhead{margin:-6px 0 8px}
.wl-items{display:grid;gap:8px;margin-top:8px}
.wl-items li{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:8px 12px;padding:8px 8px 8px 12px;border:2px solid var(--line);border-radius:var(--r)}
.two{display:grid;gap:14px}
@container pview (min-width:520px){.two{grid-template-columns:1fr 1fr}}
input.age{width:8rem}
.danger-zone h4{font-size:16px}
.pst{display:inline-grid;place-items:center;width:22px;height:22px;flex:none;border:2px solid #000;border-radius:50%;font-size:12px;font-weight:800;line-height:1}
.pst.warn{background:var(--main);color:#000}
.pst.ok{background:#fff;color:#000}
.pst.off{background:var(--off);color:var(--ink);border-color:var(--muted)}
.pst.bad{background:var(--danger);color:#000}
.pst.plan{background:var(--paper);color:var(--ink);border-style:dotted}
button.chipbtn{min-height:36px;cursor:pointer;font:inherit;font-size:14px;font-weight:700}
button.chipbtn:hover{text-decoration:underline;text-underline-offset:3px}

.dlg-danger{display:grid;gap:6px;margin-top:8px;padding-top:16px;border-top:2px dashed var(--muted)}
.dlg-danger h3{font-size:16px}
.dlg-danger .btn{margin-top:4px}

/* Log + danger */
.log{display:grid;gap:16px}
.log>li{padding-left:14px;border-left:4px solid var(--line)}
.log-title{font-weight:700;display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.log-lines{margin:4px 0;display:grid;gap:2px;font-size:15px}
.danger-zone{padding:20px;border:2px dashed var(--muted);border-radius:var(--r);display:grid;gap:8px;justify-items:start}
.danger-zone h2{font-size:17px}

/* Dialog + toast */
dialog{border:2px solid var(--line);border-radius:var(--r);box-shadow:6px 6px 0 0 var(--line);background:var(--surface);color:var(--ink);padding:0;width:min(30rem,calc(100vw - 2rem));max-height:calc(100dvh - 2rem)}
dialog::backdrop{background:rgb(0 0 0 / .45)}
.dlg-head{padding:12px 12px 12px 20px;border-bottom:2px solid var(--line);display:flex;justify-content:space-between;align-items:center;gap:16px}
.dlg-head h2{font-size:20px}
.dlg-body{padding:20px;display:grid;gap:16px}
.dlg-foot{padding:14px 20px;border-top:2px solid var(--line);display:flex;justify-content:flex-end;gap:10px;flex-wrap:wrap;background:var(--paper)}
.toast{position:fixed;left:50%;bottom:calc(16px + env(safe-area-inset-bottom,0px));translate:-50% 0;background:var(--ink);color:var(--surface);padding:12px 16px;border-radius:var(--r);font-weight:700;max-width:calc(100vw - 2rem);z-index:60;box-shadow:3px 3px 0 0 var(--main)}

@media (prefers-reduced-motion:reduce){
  .ttab{transition:none}
  .btn{transition:none}
  .btn:hover,.btn:active{translate:none;box-shadow:var(--shadow)}
  .btn.plain:hover{box-shadow:none}
  .spinner{animation-duration:2.4s}
  .toggle input,.toggle input::before{transition:none}
}

<script>
(() => {

const D = s => new Date(s.length === 10 ? s + 'T00:00:00' : s);

  if (p.role === 'adult') return 'erw';

function route() {
  const parts = location.hash.replace(/^#\/?/, '').split('/');
  if (parts[0] === 'familie' && parts[1]) return { view: 'detail', id: parts[1], topic: TOPICS.some(t => t[0] === parts[2]) ? parts[2] : null, pid: parts[3] || null };
  return { view: 'list' };
}
const currentFamily = () => { const r = route(); return r.view === 'detail' ? db.families.find(f => f.id === r.id) : null; };
const person = (f, id) => f.people.find(p => p.id === id);
const wsOf = (f, pid) => f.ws[pid] || (f.ws[pid] = WS());
const fkey = (f, scope, name) => `${f.id}|${scope}.${name}`;
const ikey = (f, pid, wid) => `${f.id}|${pid}:${wid}`;

/* ---------- stats ---------- */
function personMissing(f, p) {
  const m = [];
  if (!p.diet) m.push('Essen');
  if (wsOf(f, p.id).rank.length < target(p)) m.push('Workshop-Wünsche');
  if (ageUnsure(p)) m.push('Alter');
  return m;
}
function stats(f) {
  const att = f.people;
  const noDiet = att.filter(p => !p.diet);
  const wsOpen = att.filter(p => wsOf(f, p.id).rank.length < target(p));
  const noAge = att.filter(ageUnsure);
  const roomOpen = ROOM_FIELDS.filter(r => !f.room[r.key]).length;
  const open = noDiet.length + wsOpen.length + noAge.length + (roomOpen ? 1 : 0) + (f.people.length ? 0 : 1);
  const last = f.log.length ? [...f.log].sort((a, b) => b.at.localeCompare(a.at))[0] : null;
  return { att, noDiet, wsOpen, noAge, roomOpen, complete: open === 0, last };
}

/* ---------- feedback ---------- */
let liveT;
function announce(msg) { const el = $('#live'); el.textContent = ''; clearTimeout(liveT); liveT = setTimeout(() => { el.textContent = msg; }, 60); }
function shout(msg) { const el = $('#alertLive'); el.textContent = ''; setTimeout(() => { el.textContent = msg; }, 60); }
let toastT;
function toast(msg) {
  toastEl.textContent = msg; toastEl.hidden = false; announce(msg);
  clearTimeout(toastT); toastT = setTimeout(() => { toastEl.hidden = true; }, 3500);
}
function log(f, cat, text, actor = ME) { f.log.push({ at: localIso(), actor, cat, text }); }

/* ---------- saving: optimistic, one request at a time, rollback on failure ---------- */
function setItem(key, val) {
  if (!key) return;
  if (val == null) delete ITEMS[key]; else ITEMS[key] = val;
  if (val === 'saved') {
    const g = gen;
    setTimeout(() => { if (g === gen && ITEMS[key] === 'saved') { delete ITEMS[key]; renderAll(); } }, 2600);
  }
}
function commit(op) {
  if (failState && failState.key === op.key) failState = null;
  op.apply();
  queue.push(op);
  setItem(op.chip, 'saving');
  saveState = { state: 'saving' };
  pendingFocus = op.focus || null;
  announce(op.who + ' wird gespeichert …');
  renderAll();
  pump();
}
function pump() {
  if (running || !queue.length) return;
  running = true;
  const g = gen, op = queue[0];
  setTimeout(() => {
    if (g !== gen) return;
    queue.shift(); running = false;
    if (ui.saveFail) {
      op.revert();
      for (let i = queue.length - 1; i >= 0; i--) if (queue[i].key === op.key) { setItem(queue[i].chip, null); queue.splice(i, 1); }
      setItem(op.chip, 'failed');
      if (op.tried != null) DRAFT[op.key] = op.tried;
      if (op.onFail) op.onFail();
      failState = { fid: op.f.id, key: op.key, chip: op.chip, msg: op.fail, tried: op.tried, retry: op.retry };
      saveState = { state: 'failed' };
      shout(op.fail);
    } else {
      setItem(op.chip, 'saved');
      if (op.log && db.families.includes(op.f)) log(op.f, op.log[0], op.log[1]);
      persist();
      saveState = queue.length ? { state: 'saving' } : { state: 'saved' };
      announce(op.done);
    }
    renderAll(); pump();
  }, ui.slow ? SLOW_MS : SAVE_MS);
}
function fmtVal(name, v) {
  if (name === 'attending' || name === 'bed') return v ? 'Ja' : 'Nein';
  if (name === 'diet') return dietLabel(v);
  return v ? SCALE_LABEL[v] : 'Keine Angabe';
}
function opField(f, scope, name, value, focus) {
  const isRoom = scope === 'room', p = isRoom ? null : person(f, scope), obj = isRoom ? f.room : p;
  const prev = obj[name];
  if (prev === value) return;
  const isText = TEXT_FIELDS.includes(name), label = LABEL[name];
  const who = isRoom ? label : `${fullName(p)}: ${label}`;
  const logWho = isRoom ? label : `${fullName(p)}, ${label}`;
  commit({
    f, key: fkey(f, scope, name), chip: fkey(f, scope, name), focus, who,
    apply() { obj[name] = value; }, revert() { obj[name] = prev; },
    log: [isRoom ? 'room' : FIELD_CAT[name], isText ? `${logWho} geändert` : `${logWho}: ${fmtVal(name, prev)} → ${fmtVal(name, value)}`],
    done: `${who} gespeichert.`,
    fail: isText ? `${who} konnte nicht gespeichert werden. Der Text steht noch im Feld.` : `${who} konnte nicht gespeichert werden. Im Feld steht wieder die vorherige Angabe: ${fmtVal(name, prev)}.`,
    tried: isText ? value : null,
    retry() { opField(f, scope, name, value, focus); }
  });
}
function rankAdd(f, p, wid, focus) {
  const d = wsOf(f, p.id), w = W(wid), prev = d.rank.slice();
  if (!w || w.mode !== 'assigned' || !eligibility(p, w).ok || prev.includes(wid) || prev.length >= 3) return;
  commit({
    f, key: `${f.id}|rank:${p.id}`, chip: ikey(f, p.id, wid), focus, who: `${fullName(p)}: Wunschliste`,
    apply() { d.rank = prev.concat([wid]); }, revert() { d.rank = prev; },
    log: ['workshop', `${fullName(p)}: ${w.title} auf Wunsch-Platz ${prev.length + 1}`],
    done: `${fullName(p)}: ${w.title} steht auf Platz ${prev.length + 1}.`,
    fail: `${fullName(p)}: ${w.title} konnte nicht auf die Wunschliste gesetzt werden. Der vorherige Stand ist wiederhergestellt.`,
    retry() { rankAdd(f, p, wid, focus); }
  });
}
function rankRemove(f, p, wid, focus) {
  const d = wsOf(f, p.id), w = W(wid), prev = d.rank.slice();
  if (!prev.includes(wid)) return;
  commit({
    f, key: `${f.id}|rank:${p.id}`, chip: ikey(f, p.id, wid), focus, who: `${fullName(p)}: Wunschliste`,
    apply() { d.rank = prev.filter(x => x !== wid); }, revert() { d.rank = prev; },
    log: ['workshop', `${fullName(p)}: ${w.title} von der Wunschliste entfernt`],
    done: `${fullName(p)}: ${w.title} ist nicht mehr auf der Wunschliste.`,
    fail: `${fullName(p)}: ${w.title} konnte nicht entfernt werden. Der vorherige Stand ist wiederhergestellt.`,
    retry() { rankRemove(f, p, wid, focus); }
  });
}
function rankMove(f, p, from, to, focus) {
  const d = wsOf(f, p.id), prev = d.rank.slice();
  if (from === to || to < 0 || to >= prev.length || from < 0 || from >= prev.length) return;
  const wid = prev[from], w = W(wid), next = prev.slice();
  next.splice(to, 0, next.splice(from, 1)[0]);
  commit({
    f, key: `${f.id}|rank:${p.id}`, chip: ikey(f, p.id, wid), focus, who: `${fullName(p)}: Reihenfolge`,
    apply() { d.rank = next; }, revert() { d.rank = prev; },
    log: ['workshop', `${fullName(p)}: ${w.title} auf Wunsch-Platz ${to + 1} verschoben`],
    done: `${fullName(p)}: ${w.title} steht jetzt auf Platz ${to + 1}.`,
    fail: `${fullName(p)}: Die neue Reihenfolge konnte nicht gespeichert werden. Die vorherige Reihenfolge ist wiederhergestellt.`,
    retry() { rankMove(f, p, from, to, focus); }
  });
}
function joinSet(f, p, wid, want, focus) {
  const d = wsOf(f, p.id), w = W(wid), had = d.join.includes(wid);
  if (!w || w.mode !== 'signup' || had === want || !eligibility(p, w).ok) return;
  if (want && remaining(wid) <= 0) return;
  const set = v => { d.join = d.join.filter(x => x !== wid); if (v) d.join.push(wid); };
  commit({
    f, key: `${f.id}|join:${p.id}:${wid}`, chip: ikey(f, p.id, wid), focus, who: `${fullName(p)}: ${w.title}`,
    apply() { set(want); }, revert() { set(had); },
    log: ['workshop', `${fullName(p)}: für ${w.title} ${want ? 'angemeldet' : 'abgemeldet'}`],
    done: `${fullName(p)} ist für ${w.title} ${want ? 'angemeldet' : 'abgemeldet'}.`,
    fail: `${fullName(p)} konnte nicht ${want ? 'für' : 'von'} ${w.title} ${want ? 'angemeldet' : 'abgemeldet'} werden. Der vorherige Stand ist wiederhergestellt.`,
    retry() { joinSet(f, p, wid, want, focus); }
  });
}
function interestSet(f, p, wid, want, focus) {
  const d = wsOf(f, p.id), w = W(wid), had = d.interest.includes(wid);
  if (!w || w.mode !== 'interest' || had === want || !eligibility(p, w).ok) return;
  const set = v => { d.interest = d.interest.filter(x => x !== wid); if (v) d.interest.push(wid); };
  commit({
    f, key: `${f.id}|interest:${p.id}:${wid}`, chip: ikey(f, p.id, wid), focus, who: `${fullName(p)}: Interesse an ${w.title}`,
    apply() { set(want); }, revert() { set(had); },
    log: ['workshop', `${fullName(p)}: Interesse an ${w.title} ${want ? 'markiert' : 'zurückgenommen'}`],
    done: `${fullName(p)}: Interesse an ${w.title} ${want ? 'markiert' : 'zurückgenommen'}.`,
    fail: `${fullName(p)}: Die Angabe zu ${w.title} konnte nicht gespeichert werden. Der vorherige Stand ist wiederhergestellt.`,
    retry() { interestSet(f, p, wid, want, focus); }
  });
}

function itemChip(key) {
  const s = ITEMS[key];
  if (s === 'saving') return '<span class="chip plan"><span class="spinner" aria-hidden="true"></span>Wird gespeichert …</span>';
  if (s === 'failed') return chipHTML('bad', '!', 'Nicht gespeichert');
  return '';
}
const storedText = (f, scope, name) => scope === 'room' ? f.room[name] : person(f, scope)[name];
const isDirty = (f, scope, name) => { const k = fkey(f, scope, name); return k in DRAFT && DRAFT[k] !== storedText(f, scope, name); };
function textControls(f, scope, name) {
  const dirty = isDirty(f, scope, name), saving = ITEMS[fkey(f, scope, name)] === 'saving';
  return `<button type="button" class="btn main" id="ts-${scope}-${name}" data-act="text-save" data-pid="${scope}" data-field="${name}"${dirty && !saving ? '' : ' disabled'}>Speichern</button>
    <button type="button" class="btn plain" id="td-${scope}-${name}" data-act="text-discard" data-pid="${scope}" data-field="${name}"${dirty && !saving ? '' : ' disabled'}>Verwerfen</button>
    ${itemChip(fkey(f, scope, name))}`;
}
function patchText(f, scope, name) { const el = document.getElementById(`tc-${scope}-${name}`); if (el) el.innerHTML = textControls(f, scope, name); }
function textField(f, scope, name, label, hint, rows) {
  return `<div class="field">
      <label class="lbl-h" for="c-${scope}-${name}">${label} <span class="opt">(optional)</span></label>
      ${hint ? `<p class="hint" id="h-${scope}-${name}">${hint}</p>` : ''}
      <textarea id="c-${scope}-${name}" rows="${rows}" autocorrect="off" data-pid="${scope}" data-field="${name}"${hint ? ` aria-describedby="h-${scope}-${name}"` : ''}></textarea>
      <div class="tctl" id="tc-${scope}-${name}">${textControls(f, scope, name)}</div>
    </div>`;
}
const dirtyIn = (f, topic, pid) => Object.keys(DRAFT).filter(k => k.startsWith(f.id + '|')).some(k => {
  const [scope, name] = k.slice(f.id.length + 1).split('.');
  if (scope === 'room' ? topic !== 'zimmer' : topic !== 'essen') return false;
  if (scope !== 'room' && (!person(f, scope) || (pid && scope !== pid))) return false;
  return DRAFT[k] !== storedText(f, scope, name);
});

/* ---------- list view ---------- */
function openChips(f, s) {
  if (!f.people.length) return maybe('Personen eintragen');
  const out = [];
  if (s.noAge.length) out.push(maybe(`Alter offen: ${persons(s.noAge.length)}`));
  if (s.noDiet.length) out.push(maybe(`Essen offen: ${persons(s.noDiet.length)}`));
  if (s.wsOpen.length) out.push(maybe(`Workshop-Wünsche offen: ${persons(s.wsOpen.length)}`));
  if (s.roomOpen) out.push(maybe(`Zimmer: ${s.roomOpen} ${s.roomOpen === 1 ? 'Frage' : 'Fragen'} offen`));
  return out.length ? out.join('') : `<span class="badge"><span aria-hidden="true">✓</span>Alles angegeben</span>`;
}
function listRow({ f, s }) {
  const dash = '<span aria-hidden="true">—</span><span class="sr-only">keine Angabe</span>';
  const last = s.last;
  return `<tr class="rowclick" data-href="#/familie/${f.id}">
    <th scope="row" data-label="Familie"><a class="rowlink" href="#/familie/${f.id}">${esc(f.name)}</a><span class="sub">${esc(f.email)}</span></th>
    <td data-label="Personen"><div class="cell">${f.people.length ? `<span>${f.people.length}</span>` : dash}</div></td>
    <td data-label="Angaben"><div class="cell">${openChips(f, s)}</div></td>
  </tr>`;
}
function viewList() {
  const all = db.families.map(f => ({ f, s: stats(f) })).sort((a, b) => a.f.name.localeCompare(b.f.name, 'de'));
  const counts = { all: all.length, open: all.filter(x => !x.s.complete).length, done: all.filter(x => x.s.complete).length };
  const FILTERS = [['all', 'Alle'], ['open', 'Angaben offen'], ['done', 'Vollständig']];
  const q = ui.q.trim().toLowerCase();
  let shown = all.filter(x => ui.filter === 'all' || (ui.filter === 'open' ? !x.s.complete : x.s.complete));
  if (q) shown = shown.filter(({ f }) => [f.name, f.email, ...f.people.map(fullName)].some(t => t.toLowerCase().includes(q)));
  const table = shown.length
    ? `<div class="table-scroll"><table class="ftable"><caption class="sr-only">Familien</caption><thead><tr><th scope="col">Familie</th><th scope="col">Personen</th><th scope="col">Angaben</th></tr></thead><tbody>${shown.map(listRow).join('')}</tbody></table></div>`
    : `<div class="empty"><p><strong>Keine Familie gefunden.</strong></p><p class="hint">Keine Familie passt zu Suche und Filter.</p><button type="button" class="btn" id="btn-filter-reset" data-act="filter-reset">Suche und Filter zurücksetzen</button></div>`;
  return `
  <div class="page-head">
    <h1 id="page-title" tabindex="-1">Familien</h1>
    <button type="button" class="btn main" id="btn-family-add" data-act="family-add">${icon('plus')}Familie hinzufügen</button>
  </div>
  <div class="toolbar">
    <div class="search"><label for="q" class="sr-only">Familien durchsuchen</label>${icon('search')}<input id="q" type="search" value="${esc(ui.q)}" placeholder="Familie, E-Mail oder Person" autocomplete="off"></div>
    <div class="seg" role="group" aria-label="Familien filtern">${FILTERS.map(([k, l]) => `<button type="button" class="btn" id="filter-${k}" data-act="filter" data-v="${k}" aria-pressed="${ui.filter === k}">${l} <span style="font-weight:500">${counts[k]}</span></button>`).join('')}</div>
  </div>
  <p class="result-count" id="result-count">${shown.length} von ${all.length} Familien</p>
  <div class="lcard">${table}</div>`;
}

/* ---------- detail view ---------- */
function savebarHTML() {
  const s = saveState.state;
  const ic = s === 'saving' ? '<span class="spinner" aria-hidden="true"></span>' : `<span class="sico" aria-hidden="true">${s === 'saved' ? '✓' : s === 'failed' ? '!' : 'i'}</span>`;
  if (s === 'idle') return '';
  const tx = s === 'saving' ? 'Wird gespeichert …' : s === 'saved' ? 'Gespeichert' : 'Nicht gespeichert';
  return `<span class="save ${s}">${ic}<span>${tx}</span></span>`;
}
function failHTML(f) {
  if (!failState || failState.fid !== f.id) return '';
  return `<div class="alert bad" style="margin-bottom:16px"><p class="alert-h"><span aria-hidden="true">!</span> Änderung nicht gespeichert</p><p>${esc(failState.msg)}</p>
    <div class="actions"><button type="button" class="btn" id="fail-retry" data-act="retry">Erneut versuchen</button><button type="button" class="btn plain" id="fail-dismiss" data-act="dismiss-fail">Schließen</button></div></div>`;
}

/* Topic: Personen (whole family): who is in the family, who comes, what is still open per person */

  const out = [];
  if (ageUnsure(p)) out.push(`<button type="button" class="chip attn chipbtn" id="oc-age-${p.id}" data-act="goto-topic" data-topic="personen" data-pid="${p.id}" data-focus="pf-age"><span aria-hidden="true">!</span>Alter fehlt<span class="sr-only">: Alter von ${esc(p.given)} eintragen</span></button>`);

/* Topic: Zimmer (whole family) */

      ${babies.length
        ? babies.map(p => `<div class="fhead"><label class="check"><input type="checkbox" id="c-${p.id}-bed" data-pid="${p.id}" data-field="bed"${p.bed ? ' checked' : ''}><span>${esc(fullName(p))} schläft im Bett der Eltern</span></label>${itemChip(fkey(f, p.id, 'bed'))}</div>`).join('') + '<p class="hint">Babys im Bett der Eltern brauchen keinen eigenen Schlafplatz.</p>'

/* Person sidebar: the one way to pick a person, shared by Personen, Essen and Workshops */
const pkey = (f, pid) => `${f.id}|${pid}`;
const ageStr = p => Number.isInteger(p.age) ? String(p.age) : '';
function pformOf(f, pid) {
  const d = PFORM[pkey(f, pid)];
  if (d) return d;
  const p = person(f, pid);
  return { given: p.given, family: p.family, role: p.role, age: ageStr(p) };
}
function pformDirty(f, pid) {
  const d = PFORM[pkey(f, pid)];
  if (!d) return false;
  if (pid === NEW) return true;
  const p = person(f, pid);
  if (!p) return false;
  return d.given !== p.given || d.family !== p.family || d.role !== p.role || (d.role === 'child' && d.age !== ageStr(p));
}
const anyPformDirty = f => f.people.some(p => pformDirty(f, p.id)) || !!PFORM[pkey(f, NEW)];
function personOpportunity(f, p, topic) {
  if (topic === 'personen') return ageUnsure(p) ? 'Alter angeben' : '';
  if (topic === 'essen') return p.diet ? '' : 'Essen angeben';
  const st = pstatus(p, wsOf(f, p.id));
  return st.cls === 'maybe' ? st.text : '';
}
function personItems(f, list, sel, topic, hasNew) {
  const items = list.map(p => {
    const on = p.id === sel, opp = personOpportunity(f, p, topic);
    const full = topic === 'workshops' && pstatus(p, wsOf(f, p.id)).k === 'complete' ? chipHTML('', '✓', pstatus(p, wsOf(f, p.id)).text) : '';
    return `<button type="button" class="pbtn" role="tab" id="pp-${p.id}" data-pid="${p.id}" aria-selected="${on}" aria-controls="pp-panel" tabindex="${on ? 0 : -1}">
      <span class="pb-name">${esc(fullName(p))}</span><span class="pb-sub">${ageLine(p)}</span>
      ${opp ? maybe(opp) : full}
    </button>`;
  }).join('');
  const nw = hasNew ? `<button type="button" class="pbtn new" role="tab" id="pp-${NEW}" data-pid="${NEW}" aria-selected="${sel === NEW}" aria-controls="pp-panel" tabindex="${sel === NEW ? 0 : -1}">
      <span class="pb-name">${esc((PFORM[pkey(f, NEW)].given || '').trim() || 'Neue Person')}</span><span class="pb-sub">Neu</span>
    </button>` : '';
  return items + nw;
}
function personSide(f, list, sel, topic, hasNew) {
  const items = personItems(f, list, sel, topic, hasNew);

/* ---------- render ---------- */
function render() {
  const ae = document.activeElement;
  const id = ae && ae !== document.body && main.contains(ae) ? ae.id : null;
  let selRange = null;
  if (id && (ae.tagName === 'TEXTAREA' || ae.type === 'search')) { try { selRange = [ae.selectionStart, ae.selectionEnd]; } catch (e) { selRange = null; } }
  const r = route();
  main.innerHTML = r.view === 'detail' ? viewDetail(r) : viewList();
  const f = currentFamily();
  // Text values are set as properties so they stay byte-for-byte as stored (incl. leading line breaks).
  if (f) main.querySelectorAll('textarea[data-field]').forEach(t => {
    const sc = t.dataset.pid, nm = t.dataset.field, key = fkey(f, sc, nm);
    t.value = key in DRAFT ? DRAFT[key] : (sc === 'room' ? f.room[nm] : person(f, sc)[nm]);
  });
  document.title = r.view === 'detail' ? `${f ? 'Familie ' + f.name : 'Familie'} – Familienfreizeit` : 'Familien – Familienfreizeit';
  if (id) {
    const el = document.getElementById(id);
    if (el && !el.disabled) {
      el.focus({ preventScroll: true });
      if (selRange) { try { el.setSelectionRange(selRange[0], selRange[1]); } catch (e) { /* ignore */ } }
    }
  }
}
function renderAll() {
  render();
  if (pendingFocus) {
    const ids = pendingFocus; pendingFocus = null;
    for (const id of ids) { const el = document.getElementById(id); if (el && !el.disabled) { el.focus({ preventScroll: true }); break; } }
  }
}
const focusId = id => { const el = document.getElementById(id); if (el) { el.focus({ preventScroll: true }); el.scrollIntoView({ block: 'nearest' }); } };

function onRoute() {
  db.families.forEach(dropDrafts);
  ui.showAllLog = false; ui.sub = 'sel'; ui.confirmRemove = null;
  const r = route();
  if (r.view === 'detail') { ui.topic = r.topic || 'zimmer'; if (r.pid) ui.sel[r.id] = r.pid; }
  render();
  window.scrollTo(0, 0);
  const t = $('#page-title'); if (t) t.focus({ preventScroll: true });
}
window.addEventListener('hashchange', () => {
  if (ownHash && location.hash === ownHash) { ownHash = null; return; }
  onRoute();
});

function dropDrafts(f) {
  if (!f) return;
  Object.keys(PFORM).filter(k => k.startsWith(f.id + '|')).forEach(k => delete PFORM[k]);
  Object.keys(DRAFT).filter(k => k.startsWith(f.id + '|')).forEach(k => delete DRAFT[k]);
}
function selectPerson(f, pid) {
  if (ui.sel[f.id] !== pid) { ui.sub = 'sel'; ui.confirmRemove = null; dropDrafts(f); }
  ui.sel[f.id] = pid;
  render();
  syncHash(f);
}
// Keeps the address in sync with tab and person. Inside sandboxed or srcdoc frames
// replaceState can be refused; then the hash is set directly and the resulting
// hashchange is ignored, so the view does not reset.
let ownHash = null;
function syncHash(f) {
  const pid = PER_PERSON.includes(ui.topic) && ui.sel[f.id] && ui.sel[f.id] !== NEW ? '/' + ui.sel[f.id] : '';
  const hash = `#/familie/${f.id}/${ui.topic}${pid}`;
  if (location.hash === hash) return;
  try { history.replaceState(null, '', location.href.split('#')[0] + hash); }
  catch (e) {
    try { ownHash = hash; location.hash = hash; } catch (e2) { ownHash = null; }
  }
}
function setTopic(f, k) {
  if (ui.topic !== k) { dropDrafts(f); ui.sub = 'sel'; ui.confirmRemove = null; }
  ui.topic = k;
  render();
  syncHash(f);
}

}

  const first = (focusSel && dlg.querySelector(focusSel)) || dlg.querySelector('.dlg-body input, .dlg-body select') || dlg.querySelector('.dlg-foot .btn');
  first.focus();
}
function closeDialog(returnId) { lastReturn = returnId; dlg.close(); }
dlg.addEventListener('close', () => {
  const el = lastReturn && document.getElementById(lastReturn);
  if (el) el.focus();
  dlg.innerHTML = '';
});
const CANCEL = '<button type="button" class="btn" data-act="dlg-close">Abbrechen</button>';
function field(id, label, o = {}) {
  const { type = 'text', value = '', hint = '', attrs = '' } = o;
  return `<div class="field"><label for="${id}">${label}</label>${hint ? `<p class="hint" id="${id}-hint">${hint}</p>` : ''}<input id="${id}" type="${type}" value="${esc(value)}" autocomplete="off" aria-describedby="${hint ? id + '-hint ' : ''}${id}-err" ${attrs}><p class="error" id="${id}-err"></p></div>`;
}
function validate(rules) {
  const bad = new Set(), seen = new Set();
  let first = null;
  for (const [id, check, msg] of rules) {
    const el = document.getElementById(id), err = document.getElementById(id + '-err');
    if (!seen.has(id)) { seen.add(id); el.removeAttribute('aria-invalid'); err.textContent = ''; }
    if (bad.has(id)) continue;
    if (!check(el.value.trim())) { bad.add(id); el.setAttribute('aria-invalid', 'true'); err.textContent = msg; first = first || el; }
  }
  if (first) { first.focus(); return false; }
  return true;
}
function surnameGuess(f) {
  const c = {};
  f.people.forEach(p => { c[p.family] = (c[p.family] || 0) + 1; });
  const best = Object.entries(c).sort((a, b) => b[1] - a[1])[0];
  return best ? best[0] : f.name;
}
const SUBMIT = {
  'f-family-add'() {
    if (!validate([
      ['fa-name', v => v, 'Bitte einen Familiennamen eingeben.'],
      ['fa-email', v => EMAIL.test(v), 'Bitte eine gültige E-Mail-Adresse eingeben.'],
      ['fa-email', v => !db.families.some(x => x.email.toLowerCase() === v.toLowerCase()), 'Diese E-Mail ist schon bei einer anderen Familie eingetragen.']
    ])) return;
    const name = $('#fa-name').value.trim(), email = $('#fa-email').value.trim();
    const f = { id: rid(), name, email, people: [], room: { privateBath: null, accessible: null, ownRoom: null, notes: '' }, ws: {}, log: [] };
    log(f, 'family', `Familie ${name} hinzugefügt`);
    db.families.push(f);
    persist(); closeDialog(null);
    location.hash = '#/familie/' + f.id;
    toast(`Familie ${name} hinzugefügt.`);
  },
  'f-family'() {

      ['fe-name', v => v, 'Bitte einen Familiennamen eingeben.'],
      ['fe-email', v => EMAIL.test(v), 'Bitte eine gültige E-Mail-Adresse eingeben.'],
      ['fe-email', v => !db.families.some(x => x !== f && x.email.toLowerCase() === v.toLowerCase()), 'Diese E-Mail ist schon bei einer anderen Familie eingetragen.']
    ])) return;
    const name = $('#fe-name').value.trim(), email = $('#fe-email').value.trim();
    if (name !== f.name) log(f, 'family', `Familienname: ${f.name} → ${name}`);
    if (email !== f.email) log(f, 'family', `E-Mail: ${f.email} → ${email}`);
    f.name = name; f.email = email;
    persist(); closeDialog('btn-family-edit'); render();
  },
  'f-family-remove'() {
    const f = currentFamily();
    db.families = db.families.filter(x => x !== f);

};
document.addEventListener('submit', e => {
  const form = e.target.closest('form[data-form]');

/* ---------- events ---------- */
document.addEventListener('click', e => {
  // In-page links ("#/…") are handled here: inside srcdoc/sandboxed frames the browser
  // would otherwise resolve them against the frame's base URL and leave the page.
  const a = e.target.closest('a[href^="#"]');
  if (a && !a.dataset.act && !(e.metaKey || e.ctrlKey || e.shiftKey || e.altKey || e.button)) {
    e.preventDefault();
    const href = a.getAttribute('href');
    if (href === '#content') { main.focus(); main.scrollIntoView({ block: 'start' }); return; }
    if (location.hash === href || (href === '#/' && !location.hash)) { onRoute(); return; }
    location.hash = href;
    return;
  }
  // Whole list row opens the family; the name link stays the keyboard and screen-reader target.
  const row = e.target.closest('tr.rowclick');
  if (row && !e.target.closest('a, button')) {
    if (window.getSelection && String(window.getSelection()).length) return; // allow selecting text
    location.hash = row.dataset.href;
    return;
  }
  const f = currentFamily();
  const tab = e.target.closest('[role="tab"]');
  if (tab && f) {
    if (tab.classList.contains('ttab')) { setTopic(f, tab.dataset.topic); focusId('tt-' + tab.dataset.topic); }
    else if (tab.classList.contains('pbtn')) { selectPerson(f, tab.dataset.pid); focusId('pp-' + tab.dataset.pid); } else { if (tab.dataset.sub === 'find' && ui.sub !== 'find') ui.find.elig = 'yes'; ui.sub = tab.dataset.sub; render(); focusId('sub-' + ui.sub); }
    return;
  }
  const wb = e.target.closest('[data-wact]');
  if (wb && f) {
    const p = person(f, ui.sel[f.id]), wid = wb.dataset.w, d = wsOf(f, p.id), inFind = !!findMode();
    switch (wb.dataset.wact) {
      case 'rank-add': rankAdd(f, p, wid, ['act-' + wid]); break;
      case 'rank-remove': rankRemove(f, p, wid, inFind ? ['act-' + wid] : ['h-wl-' + p.id]); break;
      case 'rank-set': rankMove(f, p, d.rank.indexOf(wid), +wb.dataset.to - 1, [`num-${wid}-${wb.dataset.to}`]); break;
      case 'join': joinSet(f, p, wid, true, ['act-' + wid]); break;
      case 'leave': joinSet(f, p, wid, false, inFind ? ['act-' + wid] : ['h-signup-' + p.id]); break;
      case 'interest-on': interestSet(f, p, wid, true, ['act-' + wid]); break;
      case 'interest-off': interestSet(f, p, wid, false, inFind ? ['act-' + wid] : ['h-interest-' + p.id]); break;
    }
    return;
  }
  const t = e.target.closest('[data-act]');
  if (!t) return;
  switch (t.dataset.act) {
    case 'na': e.preventDefault(); toast('Dieser Bereich ist im Prototyp nicht enthalten.'); break;
    case 'filter': ui.filter = t.dataset.v; render(); break;
    case 'filter-reset': ui.filter = 'all'; ui.q = ''; render(); focusId('q'); break;
    case 'family-add':
      openDialog(dlgShell('Familie hinzufügen',
        `${field('fa-name', 'Familienname', { hint: 'So erscheint die Familie in Listen und Zimmerplänen.' })}${field('fa-email', 'E-Mail', { type: 'email' })}`,
        `${CANCEL}<button type="submit" class="btn main">${icon('plus')}Hinzufügen</button>`, 'f-family-add'), 'btn-family-add');
      break;
    case 'family-edit':
      openDialog(dlgShell('Familie bearbeiten',
        `${field('fe-name', 'Familienname', { value: f.name, hint: 'So erscheint die Familie in Listen und Zimmerplänen. Die Nachnamen der Personen bleiben, wie sie sind.' })}${field('fe-email', 'E-Mail', { type: 'email', value: f.email })}
        <div class="dlg-danger"><h3>Familie entfernen</h3><p class="hint">Löscht die Familie mit allen Personen und Angaben.</p><div><button type="button" class="btn" id="fd-remove" data-act="family-remove">${icon('trash')}Familie entfernen</button></div></div>`,
        `${CANCEL}<button type="submit" class="btn main">Speichern</button>`, 'f-family'), 'btn-family-edit');
      break;
    case 'person-add': {
      const k = pkey(f, NEW);
      if (ui.sel[f.id] !== NEW || ui.topic !== 'personen') dropDrafts(f);
      if (!PFORM[k]) PFORM[k] = { given: '', family: surnameGuess(f), role: 'adult', age: '' };
      ui.sub = 'sel';
      ui.sel[f.id] = NEW; ui.confirmRemove = null; ui.topic = 'personen';
      render(); syncHash(f); focusId('pf-given');
      break;
    }
    case 'pform-save': {
      const pid = ui.sel[f.id], k = pkey(f, pid), d = { ...pformOf(f, pid) };
      const rules = [['pf-given', v => v, 'Bitte einen Vornamen eingeben.'], ['pf-family', v => v, 'Bitte einen Nachnamen eingeben.']];
      if (d.role === 'child') rules.push(['pf-age', v => /^\d+$/.test(v) && +v >= 1 && +v <= 17, 'Bitte das Alter in ganzen Jahren eingeben, zwischen 1 und 17.']);
      if (!validate(rules)) break;
      const vals = { given: d.given.trim(), family: d.family.trim(), role: d.role, age: d.role === 'child' ? parseInt(d.age, 10) : null };
      const newName = `${vals.given} ${vals.family}`;
      if (pid === NEW) {
        const p = { id: 'p_' + rid(), ...vals, attending: true, diet: null, allergy: '', bed: false };
        f.people.push(p); f.ws[p.id] = WS();
        delete PFORM[k]; ui.sel[f.id] = p.id;
        log(f, 'person', `${newName} hinzugefügt`); persist();
        render(); syncHash(f); focusId('pp-' + p.id);
        toast(`${newName} hinzugefügt.`);
        break;
      }
      const p = person(f, pid), prev = { given: p.given, family: p.family, role: p.role, age: p.age, bed: p.bed };
      const changes = [];
      if (fullName(p) !== newName) changes.push(`Name: ${fullName(p)} → ${newName}`);
      if (p.role !== vals.role) changes.push(`Altersgruppe: ${ROLES[p.role]} → ${ROLES[vals.role]}`);
      if (vals.role === 'child' && p.age !== vals.age) changes.push(`Alter: ${Number.isInteger(p.age) ? p.age : 'leer'} → ${vals.age}`);
      delete PFORM[k];
      if (!changes.length) { render(); break; }
      commit({
        f, key: `${f.id}|${pid}.identity`, chip: `${f.id}|${pid}.identity`, focus: ['pf-given'], who: `${newName}: Angaben`,
        apply() { Object.assign(p, vals); if (p.role !== 'infant') p.bed = false; },
        revert() { Object.assign(p, prev); },
        onFail() { PFORM[k] = d; },
        log: ['person', `${newName}, ${changes.join(', ')}`],
        done: `${newName}: Angaben gespeichert.`,
        fail: `${newName}: Die Angaben konnten nicht gespeichert werden. Die Eingaben stehen noch im Formular.`,
        retry() { PFORM[k] = d; document.getElementById('pf-save') && document.getElementById('pf-save').click(); }
      });
      break;
    }
    case 'pform-discard': {
      const pid = ui.sel[f.id];
      delete PFORM[pkey(f, pid)];
      if (pid === NEW) { ui.sel[f.id] = f.people.length ? f.people[0].id : null; render(); syncHash(f); focusId(f.people.length ? 'pp-' + f.people[0].id : 'btn-person-add'); }
      else { render(); focusId('pf-given'); announce('Änderungen verworfen.'); }
      break;
    }
    case 'person-remove-ask': ui.confirmRemove = ui.sel[f.id]; render(); focusId('prc-cancel'); break;
    case 'person-remove-cancel': ui.confirmRemove = null; render(); focusId('pd-remove'); break;
    case 'person-remove-confirm': {
      const pid = ui.confirmRemove, p = person(f, pid);
      if (!p) break;
      const nm = fullName(p);
      f.people = f.people.filter(x => x.id !== pid);
      delete f.ws[pid]; delete PFORM[pkey(f, pid)];
      ui.confirmRemove = null; ui.sel[f.id] = f.people.length ? f.people[0].id : null;
      log(f, 'person', `${nm} entfernt`); persist();
      render(); syncHash(f); focusId(f.people.length ? 'pp-' + f.people[0].id : 'btn-person-add');
      toast(`${nm} entfernt.`);
      break;
    }
    case 'family-remove':
      openDialog(dlgShell(`Familie ${esc(f.name)} entfernen?`,
        `<p>Die Familie wird mit ${persons(f.people.length)} und allen Angaben gelöscht. Das lässt sich nicht rückgängig machen.</p>`,
        `<button type="button" class="btn" data-act="family-edit">Abbrechen</button><button type="submit" class="btn danger">${icon('trash')}Familie entfernen</button>`, 'f-family-remove'), 'btn-family-edit', '.dlg-foot .btn');
      break;
    case 'goto-topic': {
      const k = t.dataset.topic, pid = t.dataset.pid;
      if (pid) { ui.sel[f.id] = pid; ui.sub = 'sel'; }
      setTopic(f, k);
      const target = k === 'zimmer' ? 'h-zw' : k === 'personen' ? (t.dataset.focus || 'pf-given') : k === 'essen' ? `c-${pid}-diet-none` : `h-wl-${pid}`;
      const el = document.getElementById(target);
      if (el) { (el.closest('.card') || el).scrollIntoView({ block: 'center', behavior: reduced() ? 'auto' : 'smooth' }); el.focus({ preventScroll: true }); }
      break;
    }
    case 'text-save': {
      const sc = t.dataset.pid, nm = t.dataset.field, key = fkey(f, sc, nm);
      if (!(key in DRAFT)) break;
      const v = DRAFT[key]; delete DRAFT[key];
      if (v === storedText(f, sc, nm)) { render(); break; }
      opField(f, sc, nm, v, [`c-${sc}-${nm}`]);
      break;
    }
    case 'text-discard': {
      const sc = t.dataset.pid, nm = t.dataset.field;
      delete DRAFT[fkey(f, sc, nm)];
      if (failState && failState.key === fkey(f, sc, nm)) { setItem(failState.chip, null); failState = null; if (saveState.state === 'failed') saveState = { state: 'idle' }; }
      render(); focusId(`c-${sc}-${nm}`); announce('Änderung verworfen.');
      break;
    }
    case 'goto-next': selectPerson(f, t.dataset.pid); { const tp = $('#tp'); if (tp) tp.scrollIntoView({ block: 'start', behavior: reduced() ? 'auto' : 'smooth' }); } focusId('pp-' + t.dataset.pid); break;
    case 'goto-find': { ui.sub = 'find-' + t.dataset.mode; ui.find = { q: '', all: false }; render(); focusId('h-find'); const pv = $('#pp-panel'); if (pv) pv.scrollIntoView({ block: 'start', behavior: reduced() ? 'auto' : 'smooth' }); break; }

      db = seed(); persist();

});

document.addEventListener('keydown', e => {
  const tab = e.target.closest && e.target.closest('[role="tab"]');
  if (!tab) return;
  const f = currentFamily(); if (!f) return;
  if (tab.classList.contains('ttab')) {
    const ks = TOPICS.map(t => t[0]), i = ks.indexOf(tab.dataset.topic), n = ks.length;
    const j = { ArrowRight: (i + 1) % n, ArrowLeft: (i - 1 + n) % n, Home: 0, End: n - 1 }[e.key];
    if (j === undefined) return;
    e.preventDefault(); setTopic(f, ks[j]); focusId('tt-' + ks[j]);
    return;
  }
  if (tab.classList.contains('pbtn')) {
    const ids = [...document.querySelectorAll('.pbtn')].map(b => b.dataset.pid), i = ids.indexOf(tab.dataset.pid), n = ids.length;
    const j = { ArrowDown: (i + 1) % n, ArrowRight: (i + 1) % n, ArrowUp: (i - 1 + n) % n, ArrowLeft: (i - 1 + n) % n, Home: 0, End: n - 1 }[e.key];
    if (j === undefined) return;
    e.preventDefault(); selectPerson(f, ids[j]); focusId('pp-' + ids[j]);
  } else {
    if (!['ArrowLeft', 'ArrowRight', 'Home', 'End'].includes(e.key)) return;
    e.preventDefault();
    const nextSub = e.key === 'Home' ? 'sel' : e.key === 'End' ? 'find' : (tab.dataset.sub === 'sel' ? 'find' : 'sel');
    if (nextSub === 'find' && ui.sub !== 'find') ui.find.elig = 'yes';
    ui.sub = nextSub;
    render(); focusId('sub-' + ui.sub);
  }
});

document.addEventListener('change', e => {
  const t = e.target;
  if (t.id === 'p-savefail') { ui.saveFail = t.checked; return; }
  if (t.id === 'p-slow') { ui.slow = t.checked; return; }
  if (t.id === 'find-all') { ui.find.all = t.checked; render(); focusId('find-all'); return; }
  if (t.dataset && t.dataset.pform === 'role') {
    const f = currentFamily(), pid = f && ui.sel[f.id];
    if (!pid) return;
    PFORM[pkey(f, pid)] = { ...pformOf(f, pid), role: t.value };
    render(); focusId(t.id);
    return;
  }
  const scope = t.dataset && t.dataset.pid, name = t.dataset && t.dataset.field;
  if (!scope || !name) return;
  const f = currentFamily(); if (!f) return;
  let v;
  if (name === 'attending' || name === 'bed') v = t.checked;
  else if (TEXT_FIELDS.includes(name)) return; // saved with the "Speichern" button
  else v = t.value || null; // "Keine Angabe" is stored as no value
  opField(f, scope, name, v, [t.id]);
});

let searchT;
document.addEventListener('input', e => {
  const t = e.target;
  if (t.id === 'q') {
    ui.q = t.value; render();
    clearTimeout(searchT);
    searchT = setTimeout(() => { const c = $('#result-count'); if (c) announce(c.textContent); }, 500);
    return;
  }
  if (t.id === 'wq') {
    ui.find.q = t.value; render();
    clearTimeout(searchT);
    searchT = setTimeout(() => { const c = $('#wcount'); if (c) announce(c.textContent); }, 500);
    return;
  }
  if (t.tagName === 'TEXTAREA' && t.dataset.field) {
    const f = currentFamily(); if (!f) return;
    const key = fkey(f, t.dataset.pid, t.dataset.field);
    if (t.value === storedText(f, t.dataset.pid, t.dataset.field)) delete DRAFT[key]; else DRAFT[key] = t.value; // exactly as typed
    patchText(f, t.dataset.pid, t.dataset.field);
    const tz = document.getElementById('tt-zimmer'); if (tz) tz.innerHTML = ttabInner(f, null, 'zimmer');
    patchSideAndTabs(f);
    return;
  }
  if (t.dataset && t.dataset.pform && t.dataset.pform !== 'role') {
    const f = currentFamily(), pid = f && ui.sel[f.id];
    if (!pid) return;
    const k = pkey(f, pid), d = { ...pformOf(f, pid), [t.dataset.pform]: t.value };
    PFORM[k] = d;
    if (pid !== NEW && !pformDirty(f, pid)) delete PFORM[k];
    const tc = document.getElementById('tc-pform'); if (tc) tc.innerHTML = pformControls(f, pid);
    patchSideAndTabs(f);
  }
});

window.addEventListener('beforeunload', e => {
  const dirty = db.families.some(f => Object.keys(DRAFT).some(k => k.startsWith(f.id + '|')) || anyPformDirty(f));
  if (dirty) { e.preventDefault(); e.returnValue = ''; }
});
{ const r0 = route(); if (r0.view === 'detail') { if (r0.topic) ui.topic = r0.topic; if (r0.pid) ui.sel[r0.id] = r0.pid; } }
render();
